---
name: Check Code

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 0'  # Sunday 05:00 UTC, audit alert
  push:
    branches: [main, renovate/**]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # for SonarQube

      # - name: Gitleaks
      #   uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
      # - name: Gitleaks Cleanup
      #   run: rm -rf results.sarif

      - name: Run prek pre-commit
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d  # v3.1.0
        with:
          extra-args: --all-files --quiet

      - name: Run CSpell
        uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169  # v9.2.0
        with:
          files: '**/*'
          incremental_files_only: false
